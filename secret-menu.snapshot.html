<!-- ============ CSS (was inside the main <style> block) ============ -->
<style>
  /* --- secret menu: matches Figma's "secret menu" mock. A subtle sparkly
     glow sits permanently in the top-right corner (per the mock's own
     annotation: "add a subtle, sparkly effect to the top right corner of
     the page") — genuinely a fixture of the page, not hover-gated. The
     hamburger icon itself IS hover-gated, same as the hand-drawn arrow +
     tilted note next to it — both stay invisible until the (larger,
     still-invisible) trigger hotspot is hovered, so the icon doesn't spoil
     the surprise before you find it. Click swaps the icon for a close X
     and slides in a full-height lime panel over a dark scrim, matching the
     mock's link list (Home, Resume, Case Studies, Side Projects) plus the
     say-hi social icons. On touch there's no hover, so the icon/hint stay
     hidden until the hotspot is actually tapped (tied to the same
     .is-open state as the panel, via JS below) rather than showing up
     front. --- */
  .secret-menu{position:fixed;inset:0;z-index:60;pointer-events:none}
  .secret-menu__glow{position:fixed;top:-56px;right:-70px;width:340px;height:288px;
        z-index:1;pointer-events:none}
  .secret-menu__trigger{position:fixed;top:16px;right:16px;z-index:3;width:64px;height:64px;
        display:flex;align-items:flex-start;justify-content:flex-end;padding:12px;
        background:none;border:none;cursor:pointer;color:#fff;
        pointer-events:auto;-webkit-tap-highlight-color:transparent;
        transition:color .3s var(--spring)}
  .secret-menu.is-open .secret-menu__trigger{color:var(--charcoal)}
  .secret-menu__icon{display:block;width:36px;height:36px;flex:none}
  .secret-menu__icon--menu{opacity:0;transition:opacity .3s ease}
  @media (hover:hover){
    .secret-menu__trigger:hover .secret-menu__icon--menu,
    .secret-menu__trigger:focus-visible .secret-menu__icon--menu{opacity:1}
  }
  .secret-menu__icon--close{display:none}
  .secret-menu.is-open .secret-menu__icon--menu{display:none}
  .secret-menu.is-open .secret-menu__icon--close{display:block;opacity:1}
  .secret-menu__hint{position:absolute;top:20px;right:34px;display:flex;
        flex-direction:column;align-items:flex-end;
        opacity:0;pointer-events:none;transition:opacity .3s ease}
  @media (hover:hover){
    .secret-menu__trigger:hover .secret-menu__hint,
    .secret-menu__trigger:focus-visible .secret-menu__hint{opacity:1}
    /* once the panel is actually open, drop the hint even if still
       hovering the trigger — it's redundant next to an open menu. */
    .secret-menu.is-open .secret-menu__hint{opacity:0 !important}
  }
  @media (hover:none){
    .secret-menu.is-open .secret-menu__hint{opacity:1}
  }
  .secret-menu__arrow{width:20px;height:44px;color:#fff;display:block;
        transform:rotate(-127deg);filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}
  .secret-menu__note{color:#fff;font-weight:600;font-size:15px;white-space:nowrap;
        margin-top:-6px;margin-right:2px;transform:rotate(16deg);
        filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}
  .secret-menu__scrim{position:fixed;inset:0;z-index:0;background:rgba(0,0,0,.3);
        opacity:0;pointer-events:none;transition:opacity .3s ease}
  .secret-menu.is-open .secret-menu__scrim{opacity:1;pointer-events:auto}
  .secret-menu__panel{position:fixed;top:0;right:0;bottom:0;z-index:1;
        width:min(430px,88vw);background:var(--lime);
        display:flex;flex-direction:column;align-items:center;
        padding:144px 24px 56px;overflow-y:auto;
        transform:translateX(100%);pointer-events:none;
        transition:transform .4s var(--spring)}
  .secret-menu.is-open .secret-menu__panel{transform:translateX(0);pointer-events:auto}
  .secret-menu__panel a{color:var(--charcoal);text-decoration:none;font-weight:600;
        font-size:clamp(24px,3vw,32px);padding:10px 0;transition:transform .3s var(--spring)}
  .secret-menu__panel a:hover,.secret-menu__panel a:focus-visible{
        transform:translateY(-6px) rotate(var(--tilt));outline:none}
  .secret-menu__socials{display:flex;gap:14px;margin-top:auto;padding-top:32px}
  .secret-menu__social{width:54px;height:54px;border:3px solid var(--charcoal);border-radius:15px;
        display:flex;align-items:center;justify-content:center;color:var(--charcoal);
        text-decoration:none;transition:transform .3s var(--spring)}
  .secret-menu__social:hover,.secret-menu__social:focus-visible{
        transform:translateY(-6px) rotate(var(--tilt));outline:none}
  .secret-menu__social svg{width:22px;height:22px}
  .secret-menu__social--linkedin{font-size:19px;font-weight:700}

  /* NOTE: index.html's shared prefers-reduced-motion rule also listed
     .secret-menu__hint,.secret-menu__panel,.secret-menu__panel a,
     .secret-menu__scrim,.secret-menu__trigger,.secret-menu__social
     alongside other unrelated selectors on one line — add those back to
     that comma list (transition:none !important) when restoring. */
</style>

<!-- ============ JS (was its own <script> tag at the end of body) ============ -->
<script>
// --- secret menu: click the corner icon to toggle the full-height panel
// open; click the scrim, click outside, or Escape closes it. Body scroll
// is locked while open since the panel + scrim together cover the whole
// viewport, matching the mock's full-screen takeover. ---
(function () {
  var menu = document.getElementById('secret-menu');
  var trigger = document.getElementById('secret-menu-trigger');
  var scrim = document.getElementById('secret-menu-scrim');
  if (!menu || !trigger) return;

  function isOpen() { return menu.classList.contains('is-open'); }
  function open() {
    menu.classList.add('is-open');
    trigger.setAttribute('aria-expanded', 'true');
    document.body.style.overflow = 'hidden';
  }
  function close() {
    menu.classList.remove('is-open');
    trigger.setAttribute('aria-expanded', 'false');
    document.body.style.overflow = '';
  }

  trigger.addEventListener('click', function () {
    if (isOpen()) close(); else open();
  });
  if (scrim) scrim.addEventListener('click', close);
  document.addEventListener('click', function (e) {
    if (isOpen() && !menu.contains(e.target)) close();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && isOpen()) close();
  });
})();
</script>
